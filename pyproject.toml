[project]
name = "tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "jupyter",
    "soundfile",
    "kokoro>=0.9.4",
    "ordered-set>=4.1.0",
    "pypinyin>=0.55.0",
    "cn2an>=0.5.23",
    "jieba>=0.42.1",
    "pypinyin-dict>=0.9.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "psutil>=5.9.0",
    "pip>=25.3",
    "en-core-web-sm",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
